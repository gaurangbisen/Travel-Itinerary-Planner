version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wayfare-backend
    ports:
      - "8000:8000"
    environment:
      - AI_MODE=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-mock-jwt-secret-wayfare-test-key-32chars}
      - SECRET_KEY=${SECRET_KEY:-wayfare-secret-compose-2026}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wayfare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
